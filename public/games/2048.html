<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      width: 360px;
      max-width: 90vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-card {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 6px;
      text-align: center;
      min-width: 70px;
    }
    .score-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
    }
    .score-val {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
    }
    .actions {
      width: 360px;
      max-width: 90vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn {
      padding: 6px 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #60a5fa; }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover { background: #475569; }
    #grid-wrap {
      position: relative;
      width: 360px;
      max-width: 90vw;
      height: 360px;
      background: #111827;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      touch-action: none;
    }
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 800;
      font-size: 26px;
      transition: transform 0.1s ease-in-out;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 24, 39, 0.9);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="font-size: 28px; font-weight: 800; color: #f59e0b;">2048</h1>
    <div class="scores">
      <div class="score-card">
        <div class="score-label">SCORE</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="score-label">BEST</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" id="undo-btn">UNDO</button>
    <button class="btn" id="new-btn">NEW GAME</button>
  </div>

  <div id="grid-wrap">
    <div id="gameover-overlay" class="overlay hidden">
      <h2 id="end-title" style="font-size: 24px; font-weight: 800;">GAME OVER</h2>
      <button class="btn" id="try-again-btn">TRY AGAIN</button>
    </div>
  </div>

  <div class="hint">Use Arrow keys or WASD or Swipe to slide tiles</div>

  <script>
    const gridWrap = document.getElementById('grid-wrap');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('gameover-overlay');
    const undoBtn = document.getElementById('undo-btn');

    let grid = Array(4).fill(null).map(() => Array(4).fill(0));
    let previousState = null;
    let score = 0;
    let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    bestEl.textContent = best;

    const COLORS = {
      0: { bg: '#1f2937', color: 'transparent' },
      2: { bg: '#334155', color: '#f8fafc' },
      4: { bg: '#475569', color: '#f8fafc' },
      8: { bg: '#d97706', color: '#ffffff' },
      16: { bg: '#ea580c', color: '#ffffff' },
      32: { bg: '#dc2626', color: '#ffffff' },
      64: { bg: '#e11d48', color: '#ffffff' },
      128: { bg: '#7c3aed', color: '#ffffff' },
      256: { bg: '#6366f1', color: '#ffffff' },
      512: { bg: '#2563eb', color: '#ffffff' },
      1024: { bg: '#0891b2', color: '#ffffff' },
      2048: { bg: '#059669', color: '#ffffff' }
    };

    function init() {
      grid = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      previousState = null;
      scoreEl.textContent = score;
      overlay.classList.add('hidden');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        const spot = empty[Math.floor(Math.random() * empty.length)];
        grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      gridWrap.querySelectorAll('.tile').forEach(e => e.remove());

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const div = document.createElement('div');
          div.className = 'tile';
          const theme = COLORS[val] || { bg: '#047857', color: '#ffffff' };
          div.style.background = theme.bg;
          div.style.color = theme.color;
          div.textContent = val > 0 ? val : '';
          if (val > 512) div.style.fontSize = '20px';
          gridWrap.appendChild(div);
        }
      }
    }

    function saveState() {
      previousState = {
        grid: grid.map(row => [...row]),
        score: score
      };
    }

    function undo() {
      if (!previousState) return;
      grid = previousState.grid.map(row => [...row]);
      score = previousState.score;
      scoreEl.textContent = score;
      previousState = null;
      overlay.classList.add('hidden');
      render();
    }

    function slide(row) {
      let filtered = row.filter(val => val !== 0);
      let gained = 0;
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          gained += filtered[i];
          filtered.splice(i + 1, 1);
        }
      }
      while (filtered.length < 4) filtered.push(0);
      return { row: filtered, gained };
    }

    function moveLeft() {
      saveState();
      let changed = false;
      let totalGained = 0;
      for (let r = 0; r < 4; r++) {
        const res = slide(grid[r]);
        if (res.row.some((val, i) => val !== grid[r][i])) changed = true;
        grid[r] = res.row;
        totalGained += res.gained;
      }
      afterMove(changed, totalGained);
    }

    function moveRight() {
      saveState();
      let changed = false;
      let totalGained = 0;
      for (let r = 0; r < 4; r++) {
        const reversed = [...grid[r]].reverse();
        const res = slide(reversed);
        const normal = res.row.reverse();
        if (normal.some((val, i) => val !== grid[r][i])) changed = true;
        grid[r] = normal;
        totalGained += res.gained;
      }
      afterMove(changed, totalGained);
    }

    function moveUp() {
      saveState();
      let changed = false;
      let totalGained = 0;
      for (let c = 0; c < 4; c++) {
        let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
        const res = slide(col);
        if (res.row.some((val, i) => val !== col[i])) changed = true;
        for (let r = 0; r < 4; r++) grid[r][c] = res.row[r];
        totalGained += res.gained;
      }
      afterMove(changed, totalGained);
    }

    function moveDown() {
      saveState();
      let changed = false;
      let totalGained = 0;
      for (let c = 0; c < 4; c++) {
        let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
        const res = slide(col);
        const normal = res.row.reverse();
        if (normal.some((val, i) => val !== grid[i][c])) changed = true;
        for (let r = 0; r < 4; r++) grid[r][c] = normal[r];
        totalGained += res.gained;
      }
      afterMove(changed, totalGained);
    }

    function afterMove(changed, gained) {
      if (changed) {
        score += gained;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('2048_best', best);
        }
        addRandomTile();
        render();
        checkGameOver();
      } else {
        previousState = null;
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) return;
          if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
          if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
        }
      }
      overlay.classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { moveLeft(); e.preventDefault(); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { moveRight(); e.preventDefault(); }
      else if (['ArrowUp', 'KeyW'].includes(e.code)) { moveUp(); e.preventDefault(); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { moveDown(); e.preventDefault(); }
    });

    // Touch swipe support
    let touchStartX = 0, touchStartY = 0;
    gridWrap.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });
    gridWrap.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveRight();
        else if (dx < -30) moveLeft();
      } else {
        if (dy > 30) moveDown();
        else if (dy < -30) moveUp();
      }
    });

    document.getElementById('new-btn').addEventListener('click', init);
    document.getElementById('try-again-btn').addEventListener('click', init);
    undoBtn.addEventListener('click', undo);

    init();
  </script>
</body>
</html>
