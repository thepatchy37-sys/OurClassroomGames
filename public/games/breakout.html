<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 520px;
      max-width: 95vw;
      padding: 10px 16px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 600;
    }
    #canvas-wrap {
      position: relative;
      width: 520px;
      max-width: 95vw;
      height: 480px;
      max-height: 68vh;
      background: #030712;
      border: 1px solid #1f2937;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 24px;
      background: #8b5cf6;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #a78bfa; transform: scale(1.02); }
    .hint { margin-top: 10px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div style="color: #a78bfa;">SCORE: <span id="score">0</span></div>
    <div style="color: #f59e0b;">LEVEL: <span id="level">1</span></div>
    <div style="color: #ef4444;">LIVES: <span id="lives">3</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="breakout" width="520" height="480"></canvas>

    <div id="start-overlay" class="overlay">
      <h2 style="font-size: 24px; font-weight: 800;">NEON BREAKOUT</h2>
      <p style="color: #94a3b8; font-size: 13px;">Destroy all bricks. Keep the ball alive!</p>
      <button class="btn" id="start-btn">START GAME</button>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
      <h2 id="result-title" style="font-size: 24px; font-weight: 800;">GAME OVER</h2>
      <p id="result-sub" style="color: #94a3b8; font-size: 14px;">Score: 0</p>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint">Mouse move or Left / Right Arrows to control paddle</div>

  <script>
    const canvas = document.getElementById('breakout');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const resultTitle = document.getElementById('result-title');
    const resultSub = document.getElementById('result-sub');

    // Synth Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, dur = 0.05, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let score = 0;
    let lives = 3;
    let level = 1;
    let isRunning = false;
    let isPaused = false;

    let paddle = { x: 210, y: 450, w: 90, h: 12, speed: 7 };
    let ball = { x: 260, y: 350, r: 6, vx: 3.5, vy: -4, speed: 5 };
    let bricks = [];
    const BRICK_ROWS = 5;
    const BRICK_COLS = 8;
    const BRICK_W = 56;
    const BRICK_H = 18;
    const BRICK_PAD = 6;
    const BRICK_OFFSET_TOP = 40;
    const BRICK_OFFSET_LEFT = 16;
    const colors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8'];

    const keys = {};

    function initBricks() {
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks.push({
            x: BRICK_OFFSET_LEFT + c * (BRICK_W + BRICK_PAD),
            y: BRICK_OFFSET_TOP + r * (BRICK_H + BRICK_PAD),
            status: 1,
            color: colors[r % colors.length],
            points: (BRICK_ROWS - r) * 10
          });
        }
      }
    }

    function resetBall() {
      paddle.x = (canvas.width - paddle.w) / 2;
      ball.x = canvas.width / 2;
      ball.y = paddle.y - 15;
      ball.speed = 4.5 + level * 0.5;
      const angle = (Math.random() * 0.6 - 0.3) - Math.PI / 2;
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.abs(Math.cos(angle) * ball.speed);
    }

    function startGame() {
      score = 0;
      lives = 3;
      level = 1;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      levelEl.textContent = level;
      initBricks();
      resetBall();
      isRunning = true;
      isPaused = false;
      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      requestAnimationFrame(loop);
    }

    function nextLevel() {
      level++;
      levelEl.textContent = level;
      playSound(780, 0.2, 'triangle');
      initBricks();
      resetBall();
    }

    function loop() {
      if (!isRunning) return;

      if (!isPaused) {
        // Paddle movement keyboard
        if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed;
        if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

        // Ball movement
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collisions
        if (ball.x - ball.r <= 0) {
          ball.x = ball.r;
          ball.vx = -ball.vx;
          playSound(280);
        } else if (ball.x + ball.r >= canvas.width) {
          ball.x = canvas.width - ball.r;
          ball.vx = -ball.vx;
          playSound(280);
        }
        if (ball.y - ball.r <= 0) {
          ball.y = ball.r;
          ball.vy = -ball.vy;
          playSound(280);
        }

        // Paddle collision
        if (
          ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.w &&
          ball.vy > 0
        ) {
          const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const maxAngle = Math.PI * 0.4;
          const angle = hit * maxAngle;
          ball.vx = Math.sin(angle) * ball.speed;
          ball.vy = -Math.cos(angle) * ball.speed;
          playSound(440);
        }

        // Brick collision
        let allCleared = true;
        for (let b of bricks) {
          if (b.status === 1) {
            allCleared = false;
            if (
              ball.x + ball.r > b.x &&
              ball.x - ball.r < b.x + BRICK_W &&
              ball.y + ball.r > b.y &&
              ball.y - ball.r < b.y + BRICK_H
            ) {
              b.status = 0;
              ball.vy = -ball.vy;
              score += b.points;
              scoreEl.textContent = score;
              playSound(600 + b.points * 5, 0.08, 'square');
              break;
            }
          }
        }

        if (allCleared) {
          nextLevel();
        }

        // Bottom out (lose life)
        if (ball.y - ball.r > canvas.height) {
          lives--;
          livesEl.textContent = lives;
          playSound(150, 0.25, 'sawtooth');
          if (lives <= 0) {
            isRunning = false;
            resultTitle.textContent = "GAME OVER";
            resultTitle.style.color = "#ef4444";
            resultSub.textContent = `Final Score: ${score} · Level: ${level}`;
            gameoverOverlay.classList.remove('hidden');
            return;
          } else {
            resetBall();
          }
        }
      }

      draw();
      requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Bricks
      for (let b of bricks) {
        if (b.status === 1) {
          ctx.fillStyle = b.color;
          ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.fillRect(b.x, b.y, BRICK_W, 3);
        }
      }

      // Draw Paddle
      ctx.fillStyle = '#a78bfa';
      ctx.shadowColor = '#8b5cf6';
      ctx.shadowBlur = 6;
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.shadowBlur = 0;

      // Draw Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, mouseX - paddle.w / 2));
    });

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && isRunning) isPaused = !isPaused;
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    initBricks();
    draw();
  </script>
</body>
</html>
