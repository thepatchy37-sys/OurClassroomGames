<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Pilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 400px;
      max-width: 95vw;
      padding: 10px 16px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 600;
    }
    #canvas-wrap {
      position: relative;
      width: 400px;
      max-width: 95vw;
      height: 520px;
      max-height: 75vh;
      background: #040914;
      border: 1px solid #1f2937;
      border-top: none;
      border-radius: 0 0 8px 8px;
      cursor: pointer;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 24px;
      background: #eab308;
      color: #030712;
      border: none;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #fde047; transform: scale(1.02); }
    .hint { margin-top: 10px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div style="color: #facc15;">SCORE: <span id="score">0</span></div>
    <div style="color: #60a5fa;">BEST: <span id="best">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="flappy" width="400" height="520"></canvas>

    <div id="start-overlay" class="overlay">
      <h2 style="font-size: 24px; font-weight: 800;">FLAPPY PILOT</h2>
      <p style="color: #94a3b8; font-size: 13px;">Tap or Press Space to Flap</p>
      <button class="btn" id="start-btn">LAUNCH</button>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
      <h2 style="font-size: 24px; font-weight: 800; color: #ef4444;">CRASHED!</h2>
      <p id="stats-label" style="color: #cbd5e1; font-size: 14px;">Score: 0</p>
      <button class="btn" id="restart-btn">FLY AGAIN</button>
    </div>
  </div>

  <div class="hint">Tap screen or Spacebar to thrust up</div>

  <script>
    const canvas = document.getElementById('flappy');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const statsLabel = document.getElementById('stats-label');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(freq, dur = 0.08, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let bird = { x: 80, y: 250, vy: 0, gravity: 0.38, jump: -6.8, radius: 14 };
    let pipes = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    bestEl.textContent = best;
    let isRunning = false;
    let frame = 0;

    const PIPE_WIDTH = 52;
    const PIPE_GAP = 135;
    const PIPE_SPEED = 2.4;

    function reset() {
      bird.y = 250;
      bird.vy = 0;
      pipes = [];
      score = 0;
      frame = 0;
      scoreEl.textContent = 0;
      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      isRunning = true;
      requestAnimationFrame(loop);
    }

    function flap() {
      if (!isRunning) return;
      bird.vy = bird.jump;
      playSfx(480, 0.06, 'triangle');
    }

    function loop() {
      if (!isRunning) return;
      frame++;

      // Bird physics
      bird.vy += bird.gravity;
      bird.y += bird.vy;

      // Spawn pipes
      if (frame % 95 === 0) {
        const minTop = 60;
        const maxTop = canvas.height - PIPE_GAP - 80;
        const topH = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
        pipes.push({
          x: canvas.width,
          top: topH,
          bottom: topH + PIPE_GAP,
          passed: false
        });
      }

      // Move pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED;

        // Collision check
        if (
          bird.x + bird.radius > p.x &&
          bird.x - bird.radius < p.x + PIPE_WIDTH &&
          (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom)
        ) {
          gameOver();
          return;
        }

        // Score update
        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          playSfx(720, 0.1, 'sine');
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem('flappy_best', best);
          }
        }

        // Remove offscreen
        if (p.x + PIPE_WIDTH < 0) {
          pipes.splice(i, 1);
        }
      }

      // Floor & ceiling collision
      if (bird.y + bird.radius >= canvas.height - 15 || bird.y - bird.radius <= 0) {
        gameOver();
        return;
      }

      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      playSfx(140, 0.3, 'sawtooth');
      statsLabel.textContent = `Score: ${score} · Best: ${best}`;
      gameoverOverlay.classList.remove('hidden');
    }

    function draw() {
      // Sky backdrop
      ctx.fillStyle = '#060d1d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant stars / skyline
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(40, 80, 2, 2);
      ctx.fillRect(160, 40, 2, 2);
      ctx.fillRect(280, 110, 2, 2);
      ctx.fillRect(350, 70, 2, 2);

      // Pipes
      for (let p of pipes) {
        // Top pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 2, p.top - 18, PIPE_WIDTH + 4, 18);

        // Bottom pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, canvas.height - p.bottom);
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 2, p.bottom, PIPE_WIDTH + 4, 18);
      }

      // Ground
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, canvas.height - 15, canvas.width, 3);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 10)));
      ctx.rotate(angle);

      // Bird body
      ctx.fillStyle = '#facc15';
      ctx.shadowColor = '#eab308';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Eye
      ctx.fillStyle = '#030712';
      ctx.beginPath();
      ctx.arc(5, -4, 3, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(8, -1);
      ctx.lineTo(16, 2);
      ctx.lineTo(8, 5);
      ctx.fill();

      ctx.restore();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (!isRunning) {
          if (!startOverlay.classList.contains('hidden') || !gameoverOverlay.classList.contains('hidden')) {
            reset();
          }
        } else {
          flap();
        }
        e.preventDefault();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (isRunning) flap();
    });

    document.getElementById('start-btn').addEventListener('click', reset);
    document.getElementById('restart-btn').addEventListener('click', reset);

    draw();
  </script>
</body>
</html>
