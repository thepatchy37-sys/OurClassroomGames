<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Pong Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 600px;
      max-width: 95vw;
      padding: 10px 16px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 600;
    }
    #canvas-wrap {
      position: relative;
      width: 600px;
      max-width: 95vw;
      height: 400px;
      max-height: 65vh;
      background: #030712;
      border: 1px solid #1f2937;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 24px;
      background: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #60a5fa; transform: scale(1.02); }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div style="color: #60a5fa;">PLAYER: <span id="p1-score">0</span></div>
    <div id="diff-label" style="color: #cbd5e1; font-size: 13px;">FIRST TO 7 WINS</div>
    <div style="color: #f87171;">AI CPU: <span id="p2-score">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="pong" width="600" height="400"></canvas>

    <div id="start-overlay" class="overlay">
      <h2 style="font-size: 24px; font-weight: 800;">CYBER PONG</h2>
      <p style="color: #94a3b8; font-size: 13px;">Move paddle with Arrow Keys or W / S</p>
      <div style="display: flex; gap: 10px;">
        <button class="btn" id="start-easy">NORMAL</button>
        <button class="btn" id="start-hard" style="background: #ef4444;">EXPERT</button>
      </div>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
      <h2 id="winner-title" style="font-size: 24px; font-weight: 800;">VICTORY</h2>
      <p id="winner-sub" style="color: #94a3b8; font-size: 14px;">Score: 7 - 4</p>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint">Use Up/Down Arrows or W/S to move paddle · Space to pause</div>

  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const winnerTitle = document.getElementById('winner-title');
    const winnerSub = document.getElementById('winner-sub');

    // Audio FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, dur = 0.06) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const PADDLE_W = 12;
    const PADDLE_H = 70;
    const BALL_SIZE = 10;
    const WIN_SCORE = 7;

    let p1 = { y: 165, vy: 0, score: 0 };
    let p2 = { y: 165, vy: 0, score: 0 };
    let ball = { x: 300, y: 200, vx: 5, vy: 2, speed: 5 };
    let aiSpeed = 3.8;
    let isRunning = false;
    let isPaused = false;
    const keys = {};

    function start(mode) {
      aiSpeed = mode === 'hard' ? 5.2 : 3.8;
      p1.score = 0;
      p2.score = 0;
      p1.y = 165;
      p2.y = 165;
      updateScoreboard();
      resetBall(1);
      isRunning = true;
      isPaused = false;
      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      requestAnimationFrame(loop);
    }

    function resetBall(direction = 1) {
      ball.x = 300;
      ball.y = 200;
      ball.speed = 5;
      const angle = (Math.random() * 0.8 - 0.4);
      ball.vx = Math.cos(angle) * ball.speed * direction;
      ball.vy = Math.sin(angle) * ball.speed;
    }

    function updateScoreboard() {
      p1ScoreEl.textContent = p1.score;
      p2ScoreEl.textContent = p2.score;
    }

    function loop() {
      if (!isRunning) return;

      if (!isPaused) {
        // Player 1 controls
        if (keys['ArrowUp'] || keys['KeyW']) p1.y -= 6;
        if (keys['ArrowDown'] || keys['KeyS']) p1.y += 6;
        p1.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p1.y));

        // AI movement
        const p2Center = p2.y + PADDLE_H / 2;
        if (ball.vx > 0) {
          if (p2Center < ball.y - 12) p2.y += aiSpeed;
          else if (p2Center > ball.y + 12) p2.y -= aiSpeed;
        } else {
          // drift back toward center
          if (p2Center < 200) p2.y += 1.5;
          else if (p2Center > 200) p2.y -= 1.5;
        }
        p2.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p2.y));

        // Ball movement
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Top/bottom bounce
        if (ball.y <= 0 || ball.y + BALL_SIZE >= canvas.height) {
          ball.vy = -ball.vy;
          playBeep(320);
        }

        // P1 Paddle collision (Left)
        if (ball.x <= 28 && ball.x >= 14 && ball.y + BALL_SIZE >= p1.y && ball.y <= p1.y + PADDLE_H) {
          const hitPos = (ball.y + BALL_SIZE/2 - (p1.y + PADDLE_H/2)) / (PADDLE_H/2);
          ball.speed = Math.min(12, ball.speed + 0.4);
          const angle = hitPos * (Math.PI / 3);
          ball.vx = Math.cos(angle) * ball.speed;
          ball.vy = Math.sin(angle) * ball.speed;
          playBeep(480);
        }

        // P2 Paddle collision (Right)
        if (ball.x + BALL_SIZE >= 572 && ball.x + BALL_SIZE <= 586 && ball.y + BALL_SIZE >= p2.y && ball.y <= p2.y + PADDLE_H) {
          const hitPos = (ball.y + BALL_SIZE/2 - (p2.y + PADDLE_H/2)) / (PADDLE_H/2);
          ball.speed = Math.min(12, ball.speed + 0.4);
          const angle = hitPos * (Math.PI / 3);
          ball.vx = -Math.cos(angle) * ball.speed;
          ball.vy = Math.sin(angle) * ball.speed;
          playBeep(440);
        }

        // Goal scoring
        if (ball.x < 0) {
          p2.score++;
          updateScoreboard();
          playBeep(200, 0.2);
          checkGameOver() || resetBall(1);
        } else if (ball.x > canvas.width) {
          p1.score++;
          updateScoreboard();
          playBeep(650, 0.2);
          checkGameOver() || resetBall(-1);
        }
      }

      draw();
      requestAnimationFrame(loop);
    }

    function checkGameOver() {
      if (p1.score >= WIN_SCORE || p2.score >= WIN_SCORE) {
        isRunning = false;
        const playerWon = p1.score >= WIN_SCORE;
        winnerTitle.textContent = playerWon ? "YOU WIN!" : "CPU WINS!";
        winnerTitle.style.color = playerWon ? "#10b981" : "#ef4444";
        winnerSub.textContent = `Score: ${p1.score} - ${p2.score}`;
        gameoverOverlay.classList.remove('hidden');
        return true;
      }
      return false;
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center net
      ctx.strokeStyle = '#1e293b';
      ctx.setLineDash([8, 8]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(300, 0);
      ctx.lineTo(300, 400);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 Paddle (Blue)
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(16, p1.y, PADDLE_W, PADDLE_H);

      // P2 Paddle (Red)
      ctx.fillStyle = '#f87171';
      ctx.fillRect(572, p2.y, PADDLE_W, PADDLE_H);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && isRunning) {
        isPaused = !isPaused;
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    document.getElementById('start-easy').addEventListener('click', () => start('easy'));
    document.getElementById('start-hard').addEventListener('click', () => start('hard'));
    document.getElementById('restart-btn').addEventListener('click', () => start('easy'));

    draw();
  </script>
</body>
</html>
