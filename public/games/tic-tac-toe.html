<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .panel {
      background: #111827;
      padding: 20px;
      border: 1px solid #1f2937;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      width: 340px;
      max-width: 90vw;
    }
    .mode-select {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .mode-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #374151;
      background: #1f2937;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .scoreboard {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: #030712;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 280px;
      height: 280px;
    }
    .cell {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .cell:hover:empty {
      background: #374151;
    }
    .cell.x {
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .cell.o {
      color: #f43f5e;
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
    }
    .status {
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      min-height: 20px;
    }
    .btn {
      padding: 8px 18px;
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="mode-select">
      <button class="mode-btn active" id="btn-ai">VS AI (SMART)</button>
      <button class="mode-btn" id="btn-2p">PASS & PLAY (2P)</button>
    </div>

    <div class="scoreboard">
      <div style="color: #38bdf8;">X: <span id="x-wins">0</span></div>
      <div style="color: #94a3b8;">TIES: <span id="ties">0</span></div>
      <div style="color: #f43f5e;">O: <span id="o-wins">0</span></div>
    </div>

    <div class="status" id="status-text">Your turn (X)</div>

    <div class="grid" id="grid">
      <div class="cell" data-idx="0"></div>
      <div class="cell" data-idx="1"></div>
      <div class="cell" data-idx="2"></div>
      <div class="cell" data-idx="3"></div>
      <div class="cell" data-idx="4"></div>
      <div class="cell" data-idx="5"></div>
      <div class="cell" data-idx="6"></div>
      <div class="cell" data-idx="7"></div>
      <div class="cell" data-idx="8"></div>
    </div>

    <button class="btn" id="reset-btn">RESET BOARD</button>
  </div>

  <script>
    let board = Array(9).fill('');
    let currentTurn = 'X';
    let vsAi = true;
    let gameOver = false;
    let xWins = 0, oWins = 0, ties = 0;

    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status-text');
    const xWinsEl = document.getElementById('x-wins');
    const oWinsEl = document.getElementById('o-wins');
    const tiesEl = document.getElementById('ties');

    const WIN_PATTERNS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function checkWinner(bd) {
      for (let [a, b, c] of WIN_PATTERNS) {
        if (bd[a] && bd[a] === bd[b] && bd[a] === bd[c]) {
          return bd[a];
        }
      }
      if (bd.every(c => c !== '')) return 'tie';
      return null;
    }

    function makeMove(idx, player) {
      if (board[idx] !== '' || gameOver) return false;
      board[idx] = player;
      cells[idx].textContent = player;
      cells[idx].classList.add(player.toLowerCase());

      const res = checkWinner(board);
      if (res) {
        gameOver = true;
        if (res === 'tie') {
          ties++;
          tiesEl.textContent = ties;
          statusText.textContent = "It's a Draw!";
          statusText.style.color = "#94a3b8";
        } else {
          if (res === 'X') {
            xWins++;
            xWinsEl.textContent = xWins;
            statusText.textContent = "Player X Wins!";
            statusText.style.color = "#38bdf8";
          } else {
            oWins++;
            oWinsEl.textContent = oWins;
            statusText.textContent = "Player O Wins!";
            statusText.style.color = "#f43f5e";
          }
        }
        return true;
      }

      currentTurn = player === 'X' ? 'O' : 'X';
      statusText.textContent = `Turn: Player ${currentTurn}`;
      statusText.style.color = currentTurn === 'X' ? '#38bdf8' : '#f43f5e';
      return true;
    }

    function minimax(bd, depth, isMaximizing) {
      const res = checkWinner(bd);
      if (res === 'O') return 10 - depth;
      if (res === 'X') return depth - 10;
      if (res === 'tie') return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (bd[i] === '') {
            bd[i] = 'O';
            let score = minimax(bd, depth + 1, false);
            bd[i] = '';
            bestScore = Math.max(score, bestScore);
          }
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < 9; i++) {
          if (bd[i] === '') {
            bd[i] = 'X';
            let score = minimax(bd, depth + 1, true);
            bd[i] = '';
            bestScore = Math.min(score, bestScore);
          }
        }
        return bestScore;
      }
    }

    function aiMove() {
      if (gameOver) return;
      let bestScore = -Infinity;
      let bestMove = -1;

      // Add 15% random chance on non-expert for fun
      const emptyIndices = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);

      for (let i of emptyIndices) {
        board[i] = 'O';
        let score = minimax(board, 0, false);
        board[i] = '';
        if (score > bestScore) {
          bestScore = score;
          bestMove = i;
        }
      }

      if (bestMove !== -1) {
        setTimeout(() => {
          makeMove(bestMove, 'O');
        }, 220);
      }
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const idx = parseInt(cell.getAttribute('data-idx'), 10);
        if (board[idx] === '' && !gameOver) {
          if (vsAi) {
            if (currentTurn === 'X') {
              const moved = makeMove(idx, 'X');
              if (moved && !gameOver) {
                statusText.textContent = "AI is thinking...";
                aiMove();
              }
            }
          } else {
            makeMove(idx, currentTurn);
          }
        }
      });
    });

    function resetBoard() {
      board = Array(9).fill('');
      currentTurn = 'X';
      gameOver = false;
      cells.forEach(c => {
        c.textContent = '';
        c.className = 'cell';
      });
      statusText.textContent = "Your turn (X)";
      statusText.style.color = "#38bdf8";
    }

    document.getElementById('reset-btn').addEventListener('click', resetBoard);

    document.getElementById('btn-ai').addEventListener('click', function() {
      vsAi = true;
      this.classList.add('active');
      document.getElementById('btn-2p').classList.remove('active');
      resetBoard();
    });

    document.getElementById('btn-2p').addEventListener('click', function() {
      vsAi = false;
      this.classList.add('active');
      document.getElementById('btn-ai').classList.remove('active');
      resetBoard();
    });
  </script>
</body>
</html>
